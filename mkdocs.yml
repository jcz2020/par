site_name: PAR — Programmable Agent Runtime
site_url: https://jcz2020.github.io/par/
site_description: A modular, type-safe agent runtime for OCaml 5.4+. LangChain + LangGraph for the OCaml ecosystem.
site_author: PAR contributors
repo_url: https://github.com/jcz2020/par
repo_name: jcz2020/par
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/console-network
  language: en

plugins:
  - search:
      separator: '[\s\-\.]+'
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          default: false
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Tutorial: 教程
            How-to: 实用指南
            Reference: 参考
            Explanation: 解释
            Quickstart: 快速上手
            Concurrency: 并发模式
            Custom LLM Provider: 自定义 LLM Provider
            Error Handling: 错误处理
            Build a RAG Pipeline: 构建 RAG 管道
            Plan-then-Execute: 计划-执行模式
            SDK Overview: SDK 概览
            Agent API: Agent API
            HITL API: HITL API
            Parallel Dispatch: 并行分发
            invoke_context: invoke_context
            Workflow API: Workflow API
            Middleware: 中间件
            Tools: 工具
            MCP Client: MCP 客户端
            Streaming API: Streaming API
            Generate API: Generate API
            RAG API: RAG API
            Document Loaders: 文档加载器
            Memory API: Memory API
            Persistence API: 持久化 API
            Prompt Caching: Prompt 缓存
            Content Blocks: 内容块
            Skills API: Skills API
            Observability: 可观测性
            Architecture: 架构
            Concurrency Model: 并发模型
            Persistence and Durability: 持久化与可靠性
            RAG Architecture: RAG 架构
            FAQ: 常见问题
          admonition_translations:
            note: 注
            tip: 提示
            warning: 警告
            danger: 危险
            info: 信息
            example: 示例
            quote: 引用
            abstract: 摘要
            success: 成功
            failure: 失败
            question: 问题
            bug: Bug
            footnote: 脚注
            title: 标题

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables

nav:
  - Home: index.md
  - Tutorial:
      - Quickstart: quickstart.md
  - How-to:
      - Concurrency: howto/concurrency.md
      - Custom LLM Provider: howto/custom-llm-provider.md
      - Error Handling: howto/error-handling.md
      - Build a RAG Pipeline: howto/rag-pipeline.md
      - Plan-then-Execute: howto/plan-then-execute.md
  - Reference:
      - SDK Overview: sdk/overview.md
      - Agent API: sdk/agent.md
      - HITL API: sdk/hitl.md
      - Parallel Dispatch: sdk/parallel.md
      - invoke_context: sdk/invoke_context.md
      - Workflow API: sdk/workflow.md
      - Middleware: sdk/middleware.md
      - Tools: sdk/tools.md
      - MCP Client: sdk/mcp.md
      - Streaming API: sdk/streaming.md
      - Generate API: sdk/generate.md
      - RAG API: sdk/rag.md
      - Document Loaders: sdk/document_loaders.md
      - Memory API: sdk/memory.md
      - Persistence API: sdk/persistence.md
      - Prompt Caching: sdk/prompt_caching.md
      - Content Blocks: sdk/content_blocks.md
      - Skills API: sdk/skills.md
      - Observability: sdk/observability.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Concurrency Model: explanation/concurrency-model.md
      - Persistence and Durability: explanation/persistence-and-durability.md
      - RAG Architecture: explanation/rag-architecture.md
      - FAQ: explanation/faq.md

not_in_nav: |
  RELEASE-TEMPLATE.md
  archive/*
  evaluations/*
  STRATEGY.md
  DECISIONS.md
  long-output-generation-mode-plan.md
  react-loop-fixes-competitive-analysis.md
  release-pipeline-redesign.md
  release.md
  v0.*-ROADMAP.md
  v0.4.11-ROADMAP.md
  audit/*
  plans/*
  rules/*
  tutorials/*
  migration/v0.7.1.md
  zh/tutorials/01-rag-qa-bot.md
  zh/tutorials/02-streaming-ui.md
  zh/migration/v0.7.1.md
  audit/v0.7.x-findings.md
