name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC = 14:00 HKT daily
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: main)"
        required: false
        default: main

permissions: read-all

defaults:
  run:
    shell: bash

jobs:
  ocaml:
    name: OCaml tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            experimental: false
          - os: macos-15
            experimental: false
          - os: windows-latest
            experimental: true
        # windows-latest is experimental and aligned with ci.yml: MinGW native
        # deps + test deps need iteration, so Windows verifies library+FFI
        # compile only; the full dune runtest runs on POSIX (nightly's purpose).
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Validate version sync
        run: |
          make validate-version
          make check-version-sync

      - name: Install MinGW system deps (Windows only)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PATH=C:\msys64\usr\bin;%PATH%
          pacman -S --noconfirm --needed ^
            mingw-w64-x86_64-pkgconf ^
            mingw-w64-x86_64-gmp ^
            mingw-w64-x86_64-sqlite3 ^
            mingw-w64-x86_64-zlib
          echo C:\msys64\mingw64\bin>> "%GITHUB_PATH%"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ runner.os == 'Windows' && '5.3.0+mingw64c' || '5.4.0' }}
          dune-cache: true
          opam-local-packages: |
            par.opam

      - name: Install dependencies
        env:
          C_INCLUDE_PATH: ${{ runner.os == 'Windows' && '/cygdrive/c/msys64/mingw64/include' || '' }}
          LIBRARY_PATH: ${{ runner.os == 'Windows' && '/cygdrive/c/msys64/mingw64/lib' || '' }}
          LDFLAGS: ${{ runner.os == 'Windows' && '-L/cygdrive/c/msys64/mingw64/lib' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            eval $(opam env)
            OCAML_LIB="$(ocamlc -where)"
            OCAML_STUBLIBS="$OCAML_LIB/stublibs"
            for lib in libz.a libz.dll.a libgmp.a libgmp.dll.a libsqlite3.a libsqlite3.dll.a; do
              cp "/cygdrive/c/msys64/mingw64/lib/$lib" "$OCAML_LIB/" 2>/dev/null || true
              cp "/cygdrive/c/msys64/mingw64/lib/$lib" "$OCAML_STUBLIBS/" 2>/dev/null || true
            done
            for dll in zlib1.dll libgmp-10.dll sqlite3.dll; do
              cp "/cygdrive/c/msys64/mingw64/bin/$dll" "$OCAML_STUBLIBS/" 2>/dev/null || true
            done
            opam install camlzip --no-depexts --keep-build-dir -y 2>/dev/null || {
              CAMLZIP_DIR=$(find "$(opam var prefix)/.opam-switch/build" -maxdepth 1 -name "camlzip*" -type d 2>/dev/null | head -1)
              if [ -n "$CAMLZIP_DIR" ] && [ -f "$CAMLZIP_DIR/Makefile" ]; then
                cp /cygdrive/c/msys64/mingw64/lib/libz.a "$CAMLZIP_DIR/" 2>/dev/null || true
                cp /cygdrive/c/msys64/mingw64/lib/libz.dll.a "$CAMLZIP_DIR/" 2>/dev/null || true
                (cd "$CAMLZIP_DIR" && make all && make install)
                opam install camlzip --fake --no-depexts -y
              fi
            }
            # No --with-test: alcotest/test deps don't install cleanly on MinGW
            # and tests are skipped on Windows anyway (see build/runtest below).
            opam install . --deps-only --no-depexts
          else
            opam install . --deps-only --with-test --no-depexts -y
          fi

      # Windows: build only FFI + library (lib/ffi transitively pulls par).
      # Bare `dune build` would also build test/ executables needing alcotest.
      - run: opam exec -- dune build ${{ runner.os == 'Windows' && 'lib/ffi' || '' }}

      - name: Run tests (skip on Windows — MinGW runtime too slow + no test deps)
        if: runner.os != 'Windows'
        run: opam exec -- dune runtest

      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: nightly-par-capi-${{ matrix.os }}
          path: _build/default/lib/ffi/par_capi.so
          if-no-files-found: warn

  python:
    name: Python bindings tests (${{ matrix.python-version }})
    needs: ocaml
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: nightly-par-capi-ubuntu-22.04
          path: _build/default/lib/ffi/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install pytest

      - run: cd bindings/python && python3 -m pytest tests/ -v
